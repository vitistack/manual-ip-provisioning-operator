{{- if .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "manual-ip-provisioning-operator.fullname" . }}
  labels:
    {{- include "manual-ip-provisioning-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "manual-ip-provisioning-operator.selectorLabels" . | nindent 4 }}
{{- end }}
